<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="pwaBgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pwaShieldGrad" x1="128" y1="112" x2="384" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#pwaBgGrad)"/>

  <!-- Subtle Rim Light -->
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Main Security Shield -->
  <path d="M256 96L128 155.2V246.4C128 326.4 182.4 400 256 416C329.6 400 384 326.4 384 246.4V155.2L256 96Z" 
        fill="url(#pwaShieldGrad)" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#pwaGlow)"/>

  <!-- Verified Checkmark -->
  <path d="M202 250L240 288L310 208" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Bottom Arch Accent -->
  <path d="M182 336C204 354 230 365 256 368C282 365 308 354 330 336" 
        stroke="#ffffff" 
        stroke-opacity="0.75" 
        stroke-width="14" 
        stroke-linecap="round"/>
</svg>
